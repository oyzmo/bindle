[package]
name = "bindle"
version = "1.34.0"
edition = "2024"
license = "GPL-3.0-or-later"
description = "A simple Markdown editor for GNOME (GTK4 + Libadwaita)"
homepage = "https://oyzmo.no/apps"

[dependencies]
adw = { version = "0.9.2", package = "libadwaita", features = ["v1_5"] }
# v4_14 for GtkPrintDialog (printing). Adwaita 1.5 already requires GTK
# 4.13.4, so this does not raise the real runtime floor.
gtk4 = { version = "0.11.4", features = ["v4_14"] }
pulldown-cmark = { version = "0.13.4", default-features = false, features = ["html"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.150"
zip = { version = "2", default-features = false, features = ["deflate"] }
cairo-rs = { version = "0.22", features = ["pdf", "png", "v1_16"] }
pangocairo = "0.22"
# ODT import: content.xml is parsed as a pull stream. Export writes the XML by
# hand, so only reading needs a parser.
quick-xml = "0.41"
