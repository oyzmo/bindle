[package]
name = "bindle"
version = "1.23.3"
edition = "2024"
license = "GPL-3.0-or-later"
description = "A simple Markdown editor for GNOME (GTK4 + Libadwaita)"
homepage = "https://oyzmo.no/apps"

[dependencies]
adw = { version = "0.9.2", package = "libadwaita", features = ["v1_5"] }
# v4_14 for GtkPrintDialog (printing). Adwaita 1.5 already requires GTK
# 4.13.4, so this does not raise the real runtime floor.
gtk4 = { version = "0.11.4", features = ["v4_14"] }
pulldown-cmark = { version = "0.13.4", default-features = false, features = ["html"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.150"
zip = { version = "2", default-features = false, features = ["deflate"] }
cairo-rs = { version = "0.22", features = ["pdf", "png", "v1_16"] }
pangocairo = "0.22"
# ODT import: content.xml is parsed as a pull stream. Export writes the XML by
# hand, so only reading needs a parser.
quick-xml = "0.41"
# Memos client. Both are pure Rust on purpose: the GNOME-native pair
# (libsoup3 / libsecret) would add two -sys build dependencies for something
# that runs on a worker thread anyway and never touches the GLib main loop.
# platform-verifier: trust the OS certificate store rather than ureq's
# compiled-in Mozilla bundle, so a self-hosted server behind a private CA
# works once that CA is installed system-wide.
ureq = { version = "3.4.0", features = ["platform-verifier"] }
keyring = { version = "4.1.6", default-features = false, features = [
    "v1",
    "zbus-secret-service-keyring-store",
] }
